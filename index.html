<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="机器人学个人知识库：数学、建模与控制、系统、感知、导航、具身智能和研究实践。">
  <title>机器人知识库</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/markdown-it.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="打开章节目录" aria-controls="fileNav" aria-expanded="false">☰</button>
      <a class="site-name" href="#home">机器人知识库</a>
      <span class="header-separator">/</span>
      <span id="headerCurrent" class="header-current">README.md</span>
      <a class="repo-link" href="https://github.com/YeLuo-123/Foxbot.github.io" target="_blank" rel="noopener noreferrer">GitHub 仓库 ↗</a>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="章节目录">
      <div class="sidebar-heading">文件</div>
      <nav id="fileNav"></nav>
    </aside>

    <main class="main-content">
      <div class="breadcrumb"><span>content</span><span class="slash">/</span><strong id="breadcrumbFile">README.md</strong></div>
      <section class="file-view" aria-label="Markdown 正文">
        <div class="file-bar">
          <span class="file-icon" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M3 1.75h6.1L13 5.6v8.65H3V1.75Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 1.75v4h4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
          <span id="fileName">README.md</span>
          <a id="editLink" href="https://github.com/YeLuo-123/Foxbot.github.io/edit/main/content/README.md" target="_blank" rel="noopener noreferrer">在 GitHub 编辑</a>
        </div>
        <article id="markdownBody" class="markdown-body" aria-live="polite"></article>
      </section>
    </main>
  </div>
</body>
</html>
